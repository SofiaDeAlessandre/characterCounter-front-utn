<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Counter</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <!-- Body -->
  <body>
    <!-- Header -->
    <header>
      <div class="logo-title">
        <img class="header-image" src="assets/images/logo.png" />
        <h1>Character Counter</h1>
      </div>
      <button class="header-button" aria-label="button-mode">⚙</button>
    </header>
    <!-- End Header-->

    <!-- Main -->
    <main>
      <!-- Hero -->
      <section class="hero">
        <h2 class="hero-title">
          Analyze your text <br />
          in real-time.
        </h2>
        <textarea
          class="hero-textarea"
          placeholder="Design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly."
          rows="7"
        ></textarea>
      </section>
      <!-- End Hero -->

      <!-- Controls -->
      <section class="controls">
        <div class="controls-left">
          <label class="checkbox-label">
            <input type="checkbox" name="exclude-spaces" />
            <span>Exclude Spaces</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="character-limit" />
            <span>Set Character Limit</span>
          </label>
        </div>
        <div class="controls-right">
          <p class="reading-time">Approx. reading time: &lt;1 minute</p>
        </div>
      </section>
      <!--End Controls-->

      <!-- Cards -->
      <section class="cards">
        <div class="card card-teal">
          <img class="card-bg" src="assets/images/card-1.png" alt="" />
          <span class="card-number">278</span>
          <span class="card-label">Total Characters</span>
        </div>
        <div class="card card-purple">
          <img class="card-bg" src="assets/images/card-2.png" alt="" />
          <span class="card-number">39</span>
          <span class="card-label">Word Count</span>
        </div>
        <div class="card card-pink">
          <img class="card-bg" src="assets/images/card-3.png" alt="" />
          <span class="card-number">04</span>
          <span class="card-label">Sentence Count</span>
        </div>
      </section>
      <!-- End Cards -->

      <!-- Letter Density -->
      <!-- Investigación -> <progress>: elemento nativo HTML para barras de progreso.
  value= cantidad actual, max= valor máximo posible.
  Se estiliza con pseudo-elementos por navegador (ver en 'styles.css') -->

      <section class="density">
        <h3 class="density-title">Letter Density</h3>

        <div class="density-row">
          <span class="density-letter">E</span>
          <progress class="density-bar" value="40" max="100"></progress>
          <span class="density-count">40 (16.06%)</span>
        </div>

        <div class="density-row">
          <span class="density-letter">I</span>
          <progress class="density-bar" value="29" max="100"></progress>
          <span class="density-count">29 (11.65%)</span>
        </div>

        <div class="density-row">
          <span class="density-letter">T</span>
          <progress class="density-bar" value="28" max="100"></progress>
          <span class="density-count">28 (11.24%)</span>
        </div>

        <div class="density-row">
          <span class="density-letter">O</span>
          <progress class="density-bar" value="22" max="100"></progress>
          <span class="density-count">22 (8.84%)</span>
        </div>

        <div class="density-row">
          <span class="density-letter">N</span>
          <progress class="density-bar" value="21" max="100"></progress>
          <span class="density-count">21 (8.43%)</span>
        </div>

        <button class="see-more">
          <span>See more</span>
          <span class="see-more-icon">▼</span>
        </button>
      </section>
      <!-- End Letter Density -->
    </main>
    <!-- End Main -->
  </body>
  <!-- End Body -->
</html>
